name: Clojure CI

on: [push]

env:
  GIT_SSH_COMMAND: "ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: clojure:openjdk-17-tools-deps-slim-bullseye@sha256:d5577c7b5ee914a7c187818f2669f01091ef5aa4b3a2aa9ce13e980eb54613de
      volumes:
        - ${{ github.workspace }}:${{ github.workspace }}

    steps:
    - uses: actions/checkout@v7.0.1
      name: "Checkout git repository"

    - name: Cache dependencies
      uses: actions/cache@v6.1.0
      id: cache-deps
      with:
        path: |
          /root/.gitlibs
          /root/.m2
        key: ${{ runner.os }}-${{ hashFiles('**/deps.edn') }}

    - name: Check
      id: check
      run: clojure -T:project check

    - name: Lint
      id: lint
      run: clojure -T:project lint

    - name: Format
      run: clojure -T:project format-check
